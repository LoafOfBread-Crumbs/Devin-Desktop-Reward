<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Snake</title>
  <style>
    :root {
      --bg: #050510;
      --panel: #0b0b1a;
      --accent: #00ff9d;
      --accent-glow: rgba(0, 255, 157, 0.45);
      --food: #ff2a6d;
      --food-glow: rgba(255, 42, 109, 0.55);
      --text: #e0e0f0;
      --muted: #8888a0;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
      max-width: 100%;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      text-shadow: 0 0 12px var(--accent-glow), 0 0 24px var(--accent-glow);
    }

    .hud {
      width: 100%;
      max-width: 640px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid #1a1a2e;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 0.95rem;
      box-shadow: 0 0 18px rgba(0, 255, 157, 0.08);
    }

    .hud span {
      color: var(--muted);
    }

    .hud strong {
      color: var(--text);
      font-size: 1.1rem;
    }

    #best {
      color: var(--accent);
    }

    .canvas-box {
      position: relative;
      border-radius: 16px;
      border: 2px solid #1f1f35;
      box-shadow: 0 0 32px rgba(0, 255, 157, 0.12), inset 0 0 40px rgba(0, 0, 0, 0.6);
      background: radial-gradient(circle at center, #0d0d1c 0%, #050510 100%);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: min(90vmin, 640px);
      height: min(90vmin, 640px);
      image-rendering: pixelated;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(5, 5, 16, 0.82);
      backdrop-filter: blur(3px);
      text-align: center;
      transition: opacity 0.2s ease;
      pointer-events: auto;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay h2 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: var(--accent);
      text-shadow: 0 0 14px var(--accent-glow);
    }

    .overlay p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .btn {
      padding: 10px 28px;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: var(--bg);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 16px var(--accent-glow);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 26px var(--accent-glow);
    }

    .btn:active {
      transform: translateY(0);
    }

    .controls-hint {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      line-height: 1.5;
    }

    .dpad {
      display: grid;
      grid-template-columns: 56px 56px 56px;
      grid-template-rows: 56px 56px 56px;
      gap: 6px;
      margin-top: 4px;
    }

    .dpad button {
      width: 56px;
      height: 56px;
      border: 1px solid #2a2a45;
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      font-size: 1.4rem;
      cursor: pointer;
      box-shadow: 0 4px 0 #111120;
      transition: transform 0.05s, box-shadow 0.05s;
    }

    .dpad button:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #111120;
    }

    .dpad .up    { grid-column: 2; grid-row: 1; }
    .dpad .left  { grid-column: 1; grid-row: 2; }
    .dpad .down  { grid-column: 2; grid-row: 3; }
    .dpad .right { grid-column: 3; grid-row: 2; }

    @media (max-height: 700px) {
      .game-wrapper {
        gap: 8px;
        padding: 10px;
      }
      h1 {
        font-size: clamp(1.2rem, 3.5vh, 1.8rem);
        letter-spacing: 2px;
      }
      .hud {
        padding: 8px 14px;
        font-size: 0.85rem;
      }
      .controls-hint {
        font-size: 0.75rem;
      }
      .dpad {
        grid-template-columns: 48px 48px 48px;
        grid-template-rows: 48px 48px 48px;
      }
      .dpad button {
        width: 48px;
        height: 48px;
      }
    }

    @media (min-width: 720px) {
      .dpad { display: none; }
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <h1>Neon Snake</h1>
    <div class="hud">
      <div>Score: <strong id="score">0</strong></div>
      <div>Best: <strong id="best">0</strong></div>
    </div>

    <div class="canvas-box">
      <canvas id="game" width="640" height="640"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="title">Neon Snake</h2>
        <p id="message">Eat the glowing orbs. Don't bite yourself.</p>
        <button class="btn" id="startBtn">Start Game</button>
      </div>
    </div>

    <p class="controls-hint">
      Desktop: Arrow keys / WASD to move &nbsp;•&nbsp; Space to pause<br/>
      Mobile: tap the D-pad below
    </p>

    <div class="dpad">
      <button class="up" data-dir="up">▲</button>
      <button class="left" data-dir="left">◀</button>
      <button class="down" data-dir="down">▼</button>
      <button class="right" data-dir="right">▶</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');
    const messageEl = document.getElementById('message');
    const startBtn = document.getElementById('startBtn');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');

    const GRID = 20;
    const CELL = canvas.width / GRID;
    const FPS = 12;

    let snake = [];
    let dir = { x: 0, y: 0 };
    let nextDir = { x: 0, y: 0 };
    let food = { x: 0, y: 0 };
    let score = 0;
    let best = 0;
    let running = false;
    let paused = false;
    let timer = null;
    let particles = [];

    function loadBest() {
      try {
        best = parseInt(localStorage.getItem('neonSnakeBest'), 10) || 0;
      } catch (e) {
        best = 0;
      }
      bestEl.textContent = best;
    }

    function saveBest() {
      try {
        localStorage.setItem('neonSnakeBest', String(best));
      } catch (e) {}
    }

    function randomFood() {
      let pos;
      do {
        pos = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      return pos;
    }

    function resetGame() {
      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      food = randomFood();
      score = 0;
      scoreEl.textContent = score;
      particles = [];
      paused = false;
      running = true;
      overlay.classList.add('hidden');
      if (timer) clearInterval(timer);
      timer = setInterval(tick, 1000 / FPS);
      draw();
    }

    function gameOver() {
      running = false;
      clearInterval(timer);
      titleEl.textContent = 'Game Over';
      messageEl.textContent = `You scored ${score}. ${score >= best ? 'New best!' : 'Try again!'}`;
      startBtn.textContent = 'Restart';
      overlay.classList.remove('hidden');
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 10; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 2;
        particles.push({
          x: (x + 0.5) * CELL,
          y: (y + 0.5) * CELL,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          color
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function tick() {
      if (!running || paused) return;

      dir = { ...nextDir };

      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
          snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          saveBest();
        }
        spawnParticles(food.x, food.y, '#ff2a6d');
        food = randomFood();
      } else {
        snake.pop();
      }

      updateParticles();
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid glow
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      // Food
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      const foodGradient = ctx.createRadialGradient(fx, fy, 2, fx, fy, CELL / 1.5);
      foodGradient.addColorStop(0, '#ff80b3');
      foodGradient.addColorStop(0.5, '#ff2a6d');
      foodGradient.addColorStop(1, 'rgba(255, 42, 109, 0)');
      ctx.fillStyle = foodGradient;
      ctx.beginPath();
      ctx.arc(fx, fy, CELL / 1.2, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      snake.forEach((seg, idx) => {
        const sx = seg.x * CELL;
        const sy = seg.y * CELL;
        const head = idx === 0;
        const size = head ? CELL - 2 : CELL - 4;
        const offset = head ? 1 : 2;

        ctx.shadowBlur = head ? 16 : 10;
        ctx.shadowColor = head ? 'rgba(0, 255, 157, 0.7)' : 'rgba(0, 255, 157, 0.4)';
        ctx.fillStyle = head ? '#ffffff' : '#00ff9d';
        ctx.beginPath();
        ctx.roundRect(sx + offset, sy + offset, size, size, 6);
        ctx.fill();

        // Eyes on head
        if (head) {
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#050510';
          const ex = sx + CELL / 2 + dir.x * 3;
          const ey = sy + CELL / 2 + dir.y * 3;
          ctx.beginPath();
          ctx.arc(ex - 3, ey - 3, 2, 0, Math.PI * 2);
          ctx.arc(ex + 3, ey + 3, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Particles
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    function setDirection(x, y) {
      if (!running || paused) return;
      if (x !== 0 && dir.x !== 0) return;
      if (y !== 0 && dir.y !== 0) return;
      nextDir = { x, y };
    }

    window.addEventListener('keydown', e => {
      if (!running) return;
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W': setDirection(0, -1); e.preventDefault(); break;
        case 'ArrowDown': case 's': case 'S': setDirection(0, 1); e.preventDefault(); break;
        case 'ArrowLeft': case 'a': case 'A': setDirection(-1, 0); e.preventDefault(); break;
        case 'ArrowRight': case 'd': case 'D': setDirection(1, 0); e.preventDefault(); break;
        case ' ':
          if (running) {
            paused = !paused;
            titleEl.textContent = paused ? 'Paused' : 'Neon Snake';
            messageEl.textContent = paused ? 'Press space to resume' : 'Eat the glowing orbs. Don\'t bite yourself.';
            if (paused) overlay.classList.remove('hidden');
            else overlay.classList.add('hidden');
          }
          e.preventDefault();
          break;
      }
    });

    document.querySelectorAll('.dpad button').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = btn.dataset.dir;
        if (d === 'up') setDirection(0, -1);
        if (d === 'down') setDirection(0, 1);
        if (d === 'left') setDirection(-1, 0);
        if (d === 'right') setDirection(1, 0);
      });
    });

    startBtn.addEventListener('click', resetGame);

    loadBest();
    draw();
  </script>
</body>
</html>
