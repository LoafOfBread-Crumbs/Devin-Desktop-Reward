<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep void background -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b0c15"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>

    <!-- Neon glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong outer glow for serpent -->
    <filter id="glow-strong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Faded dungeon grid -->
  <g stroke="#1a1c2e" stroke-width="2">
    <line x1="64" y1="64" x2="448" y2="64"/>
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="192" x2="448" y2="192"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="320" x2="448" y2="320"/>
    <line x1="64" y1="384" x2="448" y2="384"/>
    <line x1="64" y1="448" x2="448" y2="448"/>
    <line x1="64" y1="64" x2="64" y2="448"/>
    <line x1="128" y1="64" x2="128" y2="448"/>
    <line x1="192" y1="64" x2="192" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="320" y1="64" x2="320" y2="448"/>
    <line x1="384" y1="64" x2="384" y2="448"/>
    <line x1="448" y1="64" x2="448" y2="448"/>
  </g>

  <!-- Glitch corridor slices -->
  <g fill="#ff0055" opacity="0.15">
    <rect x="120" y="196" width="240" height="8"/>
    <rect x="160" y="260" width="160" height="8"/>
    <rect x="200" y="324" width="80" height="8"/>
  </g>
  <g fill="#00f0ff" opacity="0.15">
    <rect x="140" y="204" width="240" height="6"/>
    <rect x="180" y="268" width="160" height="6"/>
    <rect x="220" y="332" width="80" height="6"/>
  </g>

  <!-- Neon serpent weaving through the grid -->
  <path d="M 96 416
           L 96 352
           L 160 352
           L 160 288
           L 96 288
           L 96 224
           L 224 224
           L 224 160
           L 160 160
           L 160 96
           L 352 96
           L 352 160
           L 288 160
           L 288 224
           L 416 224
           L 416 288
           L 352 288
           L 352 352
           L 416 352
           L 416 416"
        fill="none"
        stroke="#00f0ff"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow-strong)"/>

  <!-- Serpent head / player glyph -->
  <g transform="translate(416, 416)">
    <circle r="26" fill="#00f0ff" filter="url(#glow-strong)"/>
    <text x="0" y="10" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#050508">@</text>
  </g>

  <!-- Stairs glyph at tail origin -->
  <g transform="translate(96, 416)">
    <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#ff0055" opacity="0.25"/>
    <text x="0" y="12" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#ff0055" filter="url(#glow)">></text>
  </g>

  <!-- Scattered ASCII loot/enemy glyphs -->
  <g font-family="monospace" font-weight="bold" font-size="22" text-anchor="middle" filter="url(#glow)">
    <text x="128" y="146" fill="#ff9900">s</text>
    <text x="256" y="210" fill="#ff9900">s</text>
    <text x="320" y="338" fill="#00ff66">+</text>
    <text x="384" y="146" fill="#aa00ff">?</text>
    <text x="192" y="274" fill="#00ff66">+</text>
  </g>

  <!-- Title text -->
  <g text-anchor="middle" font-family="monospace" font-weight="bold">
    <text x="256" y="80" font-size="42" fill="#ffffff" letter-spacing="4" filter="url(#glow)">NEON CRAWLER</text>
    <text x="256" y="470" font-size="14" fill="#8a8faa" letter-spacing="2">BUILT BY DEVIN · FOR THIS MOMENT</text>
  </g>

  <!-- Subtle frame -->
  <rect x="12" y="12" width="488" height="488" rx="8" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.4" filter="url(#glow)"/>
  <rect x="20" y="20" width="472" height="472" rx="6" fill="none" stroke="#ff0055" stroke-width="1" opacity="0.25"/>
</svg>
